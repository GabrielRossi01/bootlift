name: 💡 Regra nova
description: Uma mudança do Spring Boot 4 que o Bootlift ainda não detecta.
title: '[Regra nova] '
labels:
  - regra
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir, confira a [tabela de regras](https://github.com/GabrielRossi01/bootlift#regras-v10)
        e as [issues abertas](https://github.com/GabrielRossi01/bootlift/issues?q=is%3Aissue+label%3Aregra)
        para ver se ela já existe ou já foi sugerida.

  - type: textarea
    id: mudanca
    attributes:
      label: Qual mudança do Boot 4?
      description:
        Descreva o que mudou e, se possível, linke a seção do guia oficial de
        migração ou das release notes.
      placeholder: |
        O starter spring-boot-starter-xyz foi renomeado para ...
        https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#...
    validations:
      required: true

  - type: textarea
    id: antes
    attributes:
      label: Código antes (Boot 3)
      description: Uma ou mais linhas que a regra deveria apontar.
      render: text
    validations:
      required: true

  - type: textarea
    id: depois
    attributes:
      label: Código depois (Boot 4)
      description:
        Como a linha fica depois de migrada. Deixe em branco se a correção
        depender de contexto.
      render: text

  - type: dropdown
    id: severidade
    attributes:
      label: Severidade sugerida
      description: Veja os critérios no CONTRIBUTING.md.
      options:
        - error (não compila ou não sobe no Boot 4)
        - warning (obsoleto ou renomeado, ainda funciona)
        - info (recomendação)
    validations:
      required: true

  - type: dropdown
    id: onde
    attributes:
      label: Onde a regra procura?
      multiple: true
      options:
        - Build (pom.xml, Gradle, version catalog)
        - Configuração (application.*)
        - Código (Java/Kotlin)
    validations:
      required: true

  - type: checkboxes
    id: contribuir
    attributes:
      label: Contribuição
      options:
        - label: Quero implementar esta regra (vou seguir o CONTRIBUTING.md).
