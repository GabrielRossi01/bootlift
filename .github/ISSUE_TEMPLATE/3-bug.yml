name: 🐞 Bug na action
description:
  A action falhou, travou ou se comportou de um jeito estranho (fora das
  regras).
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Para problemas com uma regra específica (achado errado ou faltando), use
        o formulário **Falso positivo ou negativo**.

  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      placeholder: 'Ex.: o comentário no PR não foi criado e o log mostra ...'
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Trecho do workflow
      description:
        O job que usa o Bootlift, incluindo `permissions` e o bloco `with`.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log do step do Bootlift
      description:
        Copie a saída do step. Para mais detalhes, rode de novo com o debug
        ativado (secret ACTIONS_STEP_DEBUG = true).
      render: text
    validations:
      required: true

  - type: dropdown
    id: evento
    attributes:
      label: Evento que disparou o workflow
      options:
        - pull_request
        - pull_request (vindo de fork)
        - pull_request_target
        - push
        - outro
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do Bootlift
      placeholder: v1, v1.0.0, main...
    validations:
      required: true
